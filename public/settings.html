<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourLastFM - Settings</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-light">

  <nav class="navbar navbar-dark bg-black px-4">
    <a class="navbar-brand fs-3" href="/">
      <i class="mdi mdi-archive-music text-green"></i>
      Your LastFM
    </a>
    <div class="navbar-nav d-flex flex-row gap-4">
      <a class="nav-link nav-btn" href="/">Dashboard</a>
      <a class="nav-link nav-btn active" href="#">Settings</a>
    </div>
  </nav>

  <main class="container py-5">
    
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card bg-light shadow-sm">
          <div class="card-body text-light p-4">
            <h3 class="mb-4 text-green"><i class="mdi mdi-cog-outline"></i> Configuration</h3>
            
            <form id="settings-form">
              <div class="mb-3">
                <label for="lastfm-username" class="form-label text-gray">Last.fm Username</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="lastfm-username" name="LASTFM_USERNAME" required>
              </div>

              <div class="mb-3">
                <label for="lastfm-api-key" class="form-label text-gray">Last.fm API Key</label>
                <div class="input-group">
                  <input type="password" class="form-control bg-dark text-light border-secondary" id="lastfm-api-key" name="LASTFM_API_KEY">
                  <button class="btn btn-outline-secondary" type="button" id="toggle-key">
                    <i class="mdi mdi-eye"></i>
                  </button>
                </div>
                <div class="form-text text-gray-dark">Leave empty to keep current key unchanged.</div>
              </div>

              <div class="mb-3">
                <label for="avg-track-seconds" class="form-label text-gray">Average Track Duration (seconds)</label>
                <input type="number" class="form-control bg-dark text-light border-secondary" id="avg-track-seconds" name="AVG_TRACK_SECONDS" min="30">
                <div class="form-text text-gray-dark">Used to estimate total listening time. Default: 180</div>
              </div>

              <hr class="border-secondary my-4">

              <button type="submit" class="btn btn-sync w-100 py-2">
                <i class="mdi mdi-content-save"></i> Save Settings
              </button>
            </form>
          </div>
        </div>
        
        <div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
